<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Coffee Shop - Menu</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >
</head>

<body>

<header>

    <h1>Coffee Shop</h1>

    <nav>

        <a
            href="#"
            class="navicon"
            onclick="toggleMenu()"
        >
            ☰
        </a>

        <ul
            class="menu"
            id="mainMenu"
        >
            <li>
                <a href="/">Home</a>
            </li>

            <li>
                <a href="/menu">Menu</a>
            </li>

            <li>
                <a href="/about">About</a>
            </li>

            <li>
                <a href="/contact">Contact</a>
            </li>
        </ul>

    </nav>

</header>

<section class="hero">

    <h2>Our Menu</h2>

    <p>
        Explore our coffee, refreshing drinks,
        pastries and meals.
    </p>

</section>

<section class="page">

    <h1>Coffee Shop Menu</h1>

    <p>
        Choose from our freshly prepared
        drinks, pastries and meals.
    </p>

</section>

<section
    class="products"
    id="coffee-list"
>
    <p>Loading menu...</p>
</section>

<footer>

    <p>
        &copy; Cortez | 2026 Coffee Shop
    </p>

    <p>
        <a href="/">Back to Home</a>
    </p>

</footer>

<script src="/js/script.js"></script>

<script>
    function toggleMenu() {
        document
            .getElementById("mainMenu")
            .classList.toggle("active");
    }
</script>

</body>

</html>
